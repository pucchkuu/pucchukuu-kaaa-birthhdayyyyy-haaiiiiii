<style>
:root{
  --pink:#e9b8c9;
  --lilac:#b8a2d3;
  --paper:#f6eee8;
  --dark:#141117;
  --muted:#d9cadb;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:Georgia,"Times New Roman",serif;
  background:#100d13;
  color:#fff;
}

body{
  overflow-x:hidden;
}

button{
  font:inherit;
}

.app{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:18px;
  background:
    radial-gradient(circle at 50% 15%,#38283e 0,#17131a 45%,#0b090d 100%);
}

.book{
  width:min(1120px,100%);
  min-height:92vh;
  position:relative;
}

.topbar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:50;
  padding:5px 2px;
}

.brand{
  font:700 11px system-ui;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:#f4dce6;
}

.controls{
  display:flex;
  gap:8px;
}

.ctrl{
  border:1px solid #ffffff25;
  background:#ffffff0c;
  color:#fff;
  border-radius:999px;
  padding:8px 12px;
  cursor:pointer;
  font:600 12px system-ui;
}

.stage{
  position:relative;
  min-height:720px;
  display:grid;
  place-items:center;
  padding:50px 0 70px;
}

.page{
  position:absolute;
  inset:48px 0 70px;
  display:grid;
  place-items:center;
  opacity:0;
  pointer-events:none;
  transform:translateX(35px) scale(.98);
  transition:opacity .45s ease,transform .5s ease;
}

.page.active{
  opacity:1;
  pointer-events:auto;
  transform:none;
}

.pageFrame{
  position:relative !important;
  width:min(1000px,96vw) !important;
  height:min(650px,calc(100vh - 175px)) !important;
  min-height:520px !important;
  display:grid !important;
  grid-template-columns:45% 55% !important;
  overflow:hidden !important;
  border-radius:20px !important;
  background:#120e16 !important;
  box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.08) !important;
  isolation:isolate !important;
}

/* PHOTO — LEFT SIDE ONLY, FADED */
.pageFrame .photoBg{
  position:absolute !important;
  left:0 !important;
  top:0 !important;
  bottom:0 !important;
  width:45% !important;
  z-index:1 !important;
  overflow:hidden !important;
  pointer-events:none !important;
}

.pageFrame .photoBg img{
  position:absolute !important;
  inset:0 !important;
  width:100% !important;
  height:100% !important;
  max-width:none !important;
  max-height:none !important;
  object-fit:cover !important;
  object-position:center !important;
  display:block !important;
  opacity:.55 !important;
  filter:brightness(.72) saturate(.78) !important;
  transform:scale(1.02) !important;
}

/* Fading edge into the text area */
.pageFrame .photoShade{
  position:absolute !important;
  left:0 !important;
  top:0 !important;
  bottom:0 !important;
  width:52% !important;
  z-index:2 !important;
  pointer-events:none !important;
  background:
    linear-gradient(
      90deg,
      rgba(10,7,14,.04) 0%,
      rgba(10,7,14,.08) 58%,
      rgba(18,14,22,.98) 100%
    ) !important;
}

/* WEBSITE TEXT — RIGHT SIDE, NEVER BEHIND PHOTO */
.pageFrame > .pageText{
  position:absolute !important;
  left:45% !important;
  right:0 !important;
  top:0 !important;
  bottom:0 !important;
  z-index:50 !important;

  display:flex !important;
  flex-direction:column !important;
  justify-content:center !important;
  align-items:center !important;

  padding:42px 42px !important;
  overflow-y:auto !important;

  background:#100c15 !important;
  color:#fff !important;
  text-align:center !important;

  border-left:1px solid rgba(255,255,255,.10) !important;
  border-radius:0 !important;
  box-shadow:none !important;
  backdrop-filter:none !important;
  -webkit-backdrop-filter:none !important;
}

.pageFrame > .pageText .chapter,
.pageFrame > .pageText h2,
.pageFrame > .pageText p{
  position:relative !important;
  z-index:51 !important;
  visibility:visible !important;
  opacity:1 !important;
}

.pageFrame > .pageText .chapter{
  color:#f1b8d0 !important;
  margin-bottom:12px !important;
}

.pageFrame > .pageText h2{
  color:#fff !important;
  text-shadow:0 2px 12px rgba(0,0,0,.85) !important;
}

.pageFrame > .pageText p{
  color:#f8eff7 !important;
  text-shadow:0 2px 10px rgba(0,0,0,.75) !important;
  white-space:pre-line !important;
}

/* INTERACTIVE BUTTONS / REVEALS */
.pageFrame > .hotspot{
  z-index:120 !important;
}

.pageFrame > .reveal{
  position:absolute !important;
  left:45% !important;
  right:0 !important;
  top:0 !important;
  bottom:0 !important;
  z-index:200 !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  padding:35px !important;
  background:#100c15 !important;
}

.pageFrame > .reveal .box{
  max-width:620px !important;
  width:100% !important;
  max-height:90% !important;
  overflow:auto !important;
  background:#19131f !important;
  color:#fff !important;
  border:1px solid rgba(255,255,255,.15) !important;
  border-radius:20px !important;
  padding:28px !important;
  box-shadow:0 20px 60px rgba(0,0,0,.65) !important;
}

/* FINAL PAGE CONTENT */
.pageFrame .final20{
  position:absolute !important;
  inset:0 !important;
  z-index:60 !important;
  display:grid !important;
  grid-template-columns:45% 55% !important;
}

.pageFrame .final20bg{
  position:absolute !important;
  left:0 !important;
  top:0 !important;
  bottom:0 !important;
  width:45% !important;
  z-index:1 !important;
  background:transparent !important;
}

.pageFrame .final20content{
  position:absolute !important;
  left:45% !important;
  right:0 !important;
  top:0 !important;
  bottom:0 !important;
  z-index:100 !important;
  display:flex !important;
  flex-direction:column !important;
  justify-content:center !important;
  align-items:center !important;
  text-align:center !important;
  padding:40px !important;
  background:#100c15 !important;
}

.pageFrame .final20content .finalButton{
  position:relative !important;
  z-index:150 !important;
  cursor:pointer !important;
}

/* FINAL REVEAL — opens reliably on top of everything */
.pageFrame > .finalReveal{
  position:absolute !important;
  left:45% !important;
  right:0 !important;
  top:0 !important;
  bottom:0 !important;
  z-index:500 !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  padding:30px !important;
  background:#100c15 !important;
  overflow:auto !important;
}

.pageFrame > .finalReveal .finalCard{
  width:100% !important;
  max-width:650px !important;
  max-height:92% !important;
  overflow:auto !important;
  box-sizing:border-box !important;
  padding:30px !important;
  border-radius:22px !important;
  background:#19131f !important;
  color:#fff !important;
  border:1px solid rgba(255,255,255,.18) !important;

  text-align:center !important;
}

.pageFrame > .finalReveal .story,
.pageFrame > .finalReveal .ending{

@media(max-width:700px){

/* =========================

function makePages(){

/* =========================

========================= */

function showTextFallback(frame,n){

  const old=frame.querySelector("img");

  if(old){
    old.style.display="none";
  }

  const fallback=document.createElement("div");

  fallback.className="noPhoto";

  const data=story[n] || {
    title:"Our Little Story",
    text:"A little memory from our story. ♡"
  };

  fallback.innerHTML=`
    <div class="noPhotoInner">

      <div class="chapter">
        chapter ${String(n).padStart(2,"0")}
      </div>

      <h2>${data.title}</h2>

      <p>${data.text}</p>

    </div>
  `;

  frame.insertBefore(fallback,frame.firstChild);

}

/* =========================
   NAVIGATION
========================= */

function show(n){

  if(n<1){
    n=1;
  }

  if(n>20){
    n=20;
  }

  document.querySelectorAll(".page").forEach(function(page){

    page.classList.remove("active");

  });

  const target=document.querySelector(
    '.page[data-page="'+n+'"]'
  );

  if(!target){
    return;
  }

  target.classList.add("active");

  current=n;

  document.getElementById("counter").textContent=
    String(n).padStart(2,"0")+" / 20";

  document.getElementById("prev").disabled=(n===1);

  document.getElementById("next").disabled=(n===20);

  if(started){
    switchTrack(n);
  }

}


/* =========================
   MUSIC
========================= */

function currentTrack(n){

  const keys=Object.keys(tracks)
    .map(Number)
    .filter(function(k){
      return k<=n;
    });

  if(keys.length===0){
    return null;
  }

  const latest=Math.max.apply(null,keys);

  return tracks[latest];

}


function switchTrack(n){

  if(muted){
    return;
  }

  const src=currentTrack(n);

  if(!src){
    return;
  }

  if(audio.src && audio.src.endsWith(src)){
    return;
  }

  const newAudio=new Audio(src);

  newAudio.loop=true;

  newAudio.volume=.75;

  newAudio.play()
    .then(function(){

      if(audio && !audio.paused){

        audio.pause();

      }

      audio=newAudio;

    })
    .catch(function(){

      /* browser may block autoplay */

    });

}


function startMusic(){

  if(!started){

    started=true;

    document.getElementById("musicBtn").textContent="♪ Playing";

    switchTrack(current);

    return;

  }

  if(audio.paused){

    audio.play().catch(function(){});

    document.getElementById("musicBtn").textContent="♪ Playing";

  }else{

    audio.pause();

    document.getElementById("musicBtn").textContent="♪ Play";

  }

}


/* =========================
   BUTTONS
========================= */

document.getElementById("start").onclick=function(){

  document.getElementById("welcome").classList.add("hidden");

  startMusic();

};


document.getElementById("musicBtn").onclick=function(){

  startMusic();

};


document.getElementById("muteBtn").onclick=function(){

  muted=!muted;

  if(muted){

    audio.pause();

    document.getElementById("muteBtn").textContent="🔇";

  }else{

    document.getElementById("muteBtn").textContent="🔊";

    if(started){

      switchTrack(current);

    }

  }

};


document.getElementById("prev").onclick=function(){

  show(current-1);

};


document.getElementById("next").onclick=function(){

  show(current+1);

};


/* FINAL BUTTON */

document.addEventListener("click",function(e){

  const finalButton=e.target.closest ? e.target.closest("#finalOpen") : null;

  if(finalButton){

    e.preventDefault();
    e.stopPropagation();
    openFinal();

  }

});


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown",function(e){

  if(e.key==="ArrowRight"){

    show(current+1);

  }

  if(e.key==="ArrowLeft"){

    show(current-1);

  }

});


/* =========================
   MOBILE SWIPE
========================= */

let startX=0;

document.addEventListener(
  "touchstart",
  function(e){

    startX=e.changedTouches[0].screenX;

  },
  {passive:true}
);


document.addEventListener(
  "touchend",
  function(e){

    const endX=e.changedTouches[0].screenX;

    const difference=endX-startX;

    if(Math.abs(difference)>60){

      if(difference<0){

        show(current+1);

      }else{

        show(current-1);

      }

    }

  },
  {passive:true}
);
